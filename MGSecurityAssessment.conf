# MGSecurityAssessment configuration for affine-skill.
#
# This repo opts into the pre-push security scan at Layers 1 and 2 only:
#   Layer 1 — dependency / CVE scanning
#   Layer 2 — static analysis
#
# Layer 3 (active endpoint testing) does not apply: this repo is a local CLI
# that talks to a SQLite file and the AFFiNE desktop app, with no service to
# probe. Layer 4 is not enabled here.
#
# The Codex pre-commit review is deliberately NOT enabled for this repo.
INCLUDE_IN_SCAN=True
LAYERS_IN_SCAN=1,2
INCLUDE_IN_CODEX_REVIEW=False
